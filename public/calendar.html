<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telmed - kalendarz</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="dashboard.html">Telmed</a>
        <nav class="app-nav">
          <a href="dashboard.html">Panel</a>
          <a href="calendar.html">Kalendarz</a>
          <a href="appointments.html">Terminy</a>
          <a href="notifications.html">Powiadomienia</a>
          <a id="logout" href="index.html">Wyloguj</a>
        </nav>
      </div>
    </header>

    <main class="container app-page">
      <div class="page-header">
        <h1>Kalendarz</h1>
        <input id="calendar-month" aria-label="Wybrany miesiąc" type="month" />
      </div>

      <p id="calendar-message" class="form-message" role="status"></p>

      <div class="table-wrapper">
        <table class="calendar-table">
          <thead>
            <tr>
              <th>Pon</th>
              <th>Wt</th>
              <th>Śr</th>
              <th>Czw</th>
              <th>Pt</th>
              <th>Sob</th>
              <th>Nd</th>
            </tr>
          </thead>
          <tbody id="calendar-body">
            <tr><td colspan="7" class="empty-state">Ładowanie...</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <script src="js/calendar.js"></script>
  </body>
</html>
