<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telmed - panel</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="dashboard.html">Telmed</a>
        <nav class="app-nav">
          <a href="dashboard.html">Panel</a>
          <a href="calendar.html">Kalendarz</a>
          <a href="appointments.html">Terminy</a>
          <a href="notifications.html">Powiadomienia</a>
          <a id="logout" href="index.html">Wyloguj</a>
        </nav>
      </div>
    </header>

    <main class="container app-page">
      <div class="page-header">
        <div>
          <h1>Panel użytkownika</h1>
          <p id="welcome"></p>
        </div>
        <a class="btn btn-primary" href="appointment-form.html">Dodaj termin</a>
      </div>

      <p id="dashboard-message" class="form-message" role="status"></p>

      <div class="summary-grid">
        <section class="panel">
          <h2>Najbliższe terminy</h2>
          <div id="appointments-list">
            <p class="empty-state">Ładowanie...</p>
          </div>
          <a href="appointments.html">Zobacz wszystkie terminy</a>
        </section>

        <section class="panel">
          <h2>Powiadomienia</h2>
          <div id="notifications-list">
            <p class="empty-state">Ładowanie...</p>
          </div>
          <a href="notifications.html">Zobacz powiadomienia</a>
        </section>
      </div>
    </main>

    <script src="js/dashboard.js"></script>
  </body>
</html>
